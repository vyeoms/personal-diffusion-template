# Base Configuration for Flow Matching

# Model Architecture
backbone:
  architecture: "mp_res_mlp"
  init_kwargs:
    in_dim: 2
    hidden_dim: 128
    num_layers: 3

# Diffusion Process
diffusion:
  type: "flow"
  init_kwargs:
    label_dim: 0
  loss_kwargs:
    P_mean: 0.0
    P_std: 1.0

# Sampler
sampler:
  type: "flow"
  sampler_kwargs:
    num_steps: 100

# Training
training:
  random_seed: 50192834
  iters: 512
  warmup_steps: 5000
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  batch_size: 256
  lr: 5e-2
  optimizer: "adam"
  ema_decay: 0.999
  continue_from_checkpoint: False
  checkpoint_path: "/change/to/your/checkpoint.pt"
  optimizer_kwargs:
    weight_decay: 0.0
    betas: [0.9, 0.999]

# Validation
validation:
  n_samples: 64

# Data
data:
  dataset: "custom"
  image_size: 64
  center_crop: true
  num_workers: 4

# Logging
logging:
  train_log_freq: 20
  val_log_freq: 100
  save_freq: 100
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"
  wandb:
    track: True
    project: "diffusion_template_viz"
